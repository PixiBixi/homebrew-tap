name: Bump cask

# A project's release workflow sends a repository_dispatch "bump-cask" with {cask, version, sha256};
# this rewrites Casks/<cask>.rb and commits it. GoReleaser projects keep pushing their casks themselves.
on:
  repository_dispatch:
    types: [bump-cask]
  workflow_dispatch:
    inputs:
      cask:
        description: Cask name
        required: true
      version:
        description: Version, without the v
        required: true
      sha256:
        description: SHA-256 of the release archive
        required: true

permissions:
  contents: read

concurrency:
  group: bump-cask
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rewrite the cask
        env:
          CASK: ${{ github.event.client_payload.cask || inputs.cask }}
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
          SHA256: ${{ github.event.client_payload.sha256 || inputs.sha256 }}
        run: |
          set -euo pipefail
          # The payload comes from another repository: validate before it reaches a path or a file.
          [[ "$CASK" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "bad cask name: $CASK"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: $VERSION"; exit 1; }
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "bad sha256: $SHA256"; exit 1; }
          file="Casks/${CASK}.rb"
          [[ -f "$file" ]] || { echo "no $file"; exit 1; }
          grep -q 'DO NOT EDIT' "$file" && { echo "$file is generated by GoReleaser"; exit 1; }
          sed -i -E "s/^  version \"[^\"]+\"/  version \"${VERSION}\"/; s/^  sha256 \"[0-9a-f]+\"/  sha256 \"${SHA256}\"/" "$file"
          git diff --quiet && { echo "already at ${VERSION}"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Brew cask update for ${CASK} version v${VERSION}"
          git push
